# DXVK settings for Splinter Cell Chaos Theory - Unofficial Remaster
# (DXVK 3.1.1, https://github.com/doitsujin/dxvk - full option list in its dxvk.conf sample)
#
# Vsync is controlled by [Framerate] VSync in SCCTRemaster.ini (auto = on with DXVK): Vulkan vsync
# gives smooth frame pacing in borderless fullscreen without the stalls of D3D9's own windowed vsync.

# DXVK's built-in latency reduction (sleeps before each frame to keep input lag low under vsync).
# Off: whenever any window appears over the game (screenshot tool popups such as ShareX's, Windows
# notifications, overlays, the volume display), Windows composites the game and the sleep goes wrong,
# with every frame taking ~75 ms (the game drops to about 40 fps until the window is gone). Without it,
# such a window costs at most one slow frame. True = slightly lower input lag, but those stalls.
dxvk.latencySleep = False

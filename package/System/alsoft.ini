# OpenAL Soft settings used by DSOAL (dsound.dll) for the SCCT Unofficial Remaster.
# Full documentation: https://github.com/kcat/openal-soft/blob/master/alsoftrc.sample
[general]
# Speaker layout: auto-detected from Windows. Force with e.g. channels = stereo / surround51.
channels =
# Binaural 3D audio (HRTF). 'auto' enables it when Windows reports headphones;
# set hrtf = true to always use it with headphones, false to never use it.
hrtf = auto
# Matches the game's 44.1 kHz audio.
frequency = 44100

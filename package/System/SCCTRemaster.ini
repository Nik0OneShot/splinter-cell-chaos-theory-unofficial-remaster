; =============================================================================
;  Splinter Cell Chaos Theory - Unofficial Remaster  (v1.0.0-dev.4)
;  Settings file. Lines starting with ';' are comments. Restart the game after
;  changing anything. A log is written to SCCTRemaster.log next to this file.
; =============================================================================

[Display]
; Window mode: 2 = borderless fullscreen (instant alt-tab, recommended), 1 = windowed,
; 0 = exclusive fullscreen (the original mode; alt-tab is slow there).
WindowMode = 2
; Resolution. 0 = your desktop resolution, -1 = use the in-game resolution setting.
; (Borderless always renders at your monitor's resolution.)
Width = 0
Height = 0
; Exclusive fullscreen refresh rate in Hz. 0 = same as your desktop, -1 = let the game pick.
RefreshRate = 0
; Hor+ field of view, widescreen/ultrawide HUD, scope and menu scaling.
Widescreen = 1
; 1 = move the corner HUD panels out towards the screen edges, 0 = keep them in the centred 4:3 area.
HudWidescreenMode = 1
; How far (in 640x480 HUD units, at 16:9) the corner HUD panels move outwards.
HudEdgeOffset = 100
; Field of view multiplier on top of the Hor+ correction (1.0 = original framing).
FOVMultiplier = 1.0
; Show every resolution your monitor supports in the options menu.
UnlockResolutions = 1
; Allow high resolution Bink videos (needed for upscaled video packs).
HighResVideos = 1
; Cutscene videos: 1 = keep their aspect ratio and fill the screen, 0 = keep them in the 4:3 area, -1 = stretch (original).
FMVAspect = 1
; Videos (logos, intro, cutscenes) can be skipped with Space, Enter, Esc, a mouse click or controller A/B/Start.
SkippableVideos = 1
; Loading screens: 0 = the background stays 4:3 so the mission picture sits inside its frame and the
; generic loading image isn't stretched (black bars at the sides, like the menus). 1 = stretched to the
; screen width (original WidescreenFix behaviour; the picture frame is misaligned on wide screens).
StretchLoadingScreens = 0
; Skip the logo videos at startup entirely.
SkipIntro = 0
; Don't show the "start in safe mode?" prompt after a crash.
DisableSafeMode = 1
; Fixes the window getting lost off-screen when alt-tabbing in windowed mode.
WindowedAltTabFix = 1
; Steam overlay (Shift+Tab, FPS counter, F12 screenshots): Steam loads it into this game but never starts the
; part that draws it. 1 = the mod starts it a few seconds after launch when Steam hasn't. Does nothing when the
; game isn't started from Steam or the overlay is turned off in Steam.
SteamOverlayFix = 1
; Shadow map size: 0 = game default (2048). 4096 or 8192 give sharper shadows.
ShadowMapResolution = 0
; Angle-dependent shadow filtering. Set to 0 if shadows look broken on multi-monitor setups.
ShadowFiltering = 1
; HUD text position tweaks for translated versions: 0 English/other, 4 Italian, 5 Polish, 6 Russian.
GameLanguage = 0

[Framerate]
; Frame rate cap. -1 = auto (no cap with DXVK, whose vsync paces frames; otherwise your monitor's
; refresh rate), 0 = unlimited, any other number = that cap. (The original game is hard-capped at 100 FPS.)
FPSLimit = -1
; VSync: -1 = auto (on with DXVK; with Windows' D3D9: off in borderless/windowed, where RefreshSync paces
; frames, and the game's setting in exclusive fullscreen), 0 = force off, 1 = force on.
VSync = -1
; Without DXVK, borderless/windowed at your refresh rate: start every frame in step with the monitor's
; refresh, so each refresh shows exactly one new frame (smooth like vsync, without its stalls).
; 0 = plain frame cap. Not used with DXVK.
RefreshSync = 1
; Logic rate: the kinds of actors switched on below never update faster than this (in Hz), no matter
; how high the frame rate is. The player, camera, HUD and effects always update every frame.
; 0 = off (original behaviour).
LogicRate = 60
; Guards (their AI and their bodies): 0 = every frame, like the original (recommended). At 1 their
; scripted sequences break: guards stop halfway into chairs (so sleepers never fall asleep), keep
; walking into doors after typing a keypad code, or freeze while opening a door.
ThrottleAI = 0
ThrottleNPCs = 0
; Physics props (Havok objects you can knock over).
ThrottlePhysicsProps = 1
; Longest single frame the game simulates, in seconds (original: 0.1).
MaxFrameTime = 0.1
; 1 = accurate low-CPU frame limiter, 0 = the game's original busy-wait.
PreciseLimiter = 1

[Mouse]
; Raw mouse input: fixes erratic/lost mouse movement with high polling rate mice (1000-8000 Hz)
; and removes Windows mouse acceleration from aiming.
RawInput = 1
; Extra sensitivity multiplier for raw input (the in-game sensitivity slider still works).
Sensitivity = 1.0
; Menu cursor speed. 1.0 = moves exactly like your Windows cursor, higher = faster, 0 = original (very fast at high resolutions).
MenuCursorSpeed = 1.0
; Hacking minigame: 1 = a click counts the moment you press (the original waits for the release and checks
; again then, which often missed scrolling numbers), and a number the cursor tip just slipped off (within
; 0.15 s) still counts. 0 = original.
HackingClickFix = 1
; Capture the mouse again as soon as you alt-tab back (otherwise the game waits for a click).
RecaptureOnFocus = 1
; Optic cable: the original turns the camera by a fixed amount per frame, so it got faster the higher the
; frame rate (about 5.5x too fast at 165 FPS). 1 = frame-rate independent, turning exactly as fast as the
; sticky camera. Raise or lower to taste (0.5 = half as fast). 0 = original behaviour.
OpticCableSpeed = 1.0
; Aiming accuracy: turning makes your gun less accurate. The original judges one frame's mouse input, so at
; high frame rates (and with high polling rate mice or sensitivity) the slightest adjustment read as a fast turn,
; and slow turns of the aiming camera already counted. 1 = judged by how fast your view really turns over 0.1 s:
; no cost below AimFreeTurnSpeed degrees a second, rising to the weapon's full penalty at AimFullTurnSpeed.
; Small back-and-forth corrections cancel out. 0 = original.
AimAccuracyFix = 1
AimFreeTurnSpeed = 90
AimFullTurnSpeed = 360
; Log a line ([AIM]) whenever turning costs accuracy (how fast, the penalty, what the original would have done).
AimLog = 1
; Perfectly still aim: with the mouse completely still (not the faintest movement), your accuracy keeps
; settling past the weapon's usual best until shots are perfectly accurate (about a second). Any mouse
; movement brings back the usual small imperfection. 0 = original (always a little imperfect).
PerfectStillAim = 1

[Graphics]
; Which of the game's three render paths to use: 3 = Shader Model 3.0, the best one: per-pixel lighting and
; specular, parallax mapping, HDR lighting with tone mapping (an in-engine effect, no HDR monitor needed) and
; soft shadows. 2 = Shader Model 2.0. 1 = Shader Model 1.1, the oldest: crude, low-precision specular that
; sparkles and blows out, and none of the effects above. 0 = use the game's own option (it can end up on 1.1).
ShaderModel = 3
; Shader pack (Shader Model 1.1 path, ShaderModel = 1): the remaster's own versions of the game's specular
; shaders: smooth, full-precision highlights instead of the original's harsh, banded ones, and no glitter on
; bumpy or distant surfaces. 0 = the game's originals.
ShaderPack = 1
; Key that switches the shader pack on and off while playing, to compare (virtual key code; 0x75 = F6,
; 0 = none). The log notes each switch.
ShaderPackToggleKey = 0x75
; Shader pack work: this key paints one group of the game's shaders flat magenta, and each press moves to the
; next group (Shift + the key: the single shaders of the current group), so you can see which shader draws a
; surface; the log notes each step. 0x7A = F11, 0 = off.
ShaderHighlightKey = 0x7A
; EXPERIMENTAL AMD thermal vision fix: replaces the game's three legacy ps_1.1 shaders that use
; old "dependent texture read" instructions with equivalent ps_2.0 shaders.
AMDThermalFix = 0
ShaderReplaceMask = 7
; EXPERIMENTAL: report a different GPU vendor to the game. 0 = off, 1 = NVIDIA, 2 = AMD, 3 = Intel.
SpoofGPUVendor = 0
; Direct3D 9 implementation to run the game on. Default: the bundled DXVK (Direct3D 9 on Vulkan), which
; gives far smoother frame pacing than Windows' own D3D9 at high frame rates. It needs a GPU and driver
; with Vulkan 1.3; without one the game falls back to Windows' D3D9 by itself (see SCCTRemaster.log).
; Empty = Windows' D3D9. d3d9_wined3d.dll = the old wined3d AMD thermal fix, if the installer kept it.
; DXVK's own settings are in dxvk.conf.
D3D9Chain = d3d9_dxvk.dll
; Diagnostics.
LogShaders = 0
LogRenderTargets = 0

[Audio]
; Lets EAX work through the bundled DSOAL (dsound.dll) without any registry tweaks.
EAXFix = 1

[Controller]
; Use the bundled Xidi (Xidi.32.dll) so Xbox/XInput controllers work properly.
UseXidi = 1

[Gameplay]
; Some spots in the original levels trap Sam inside the wall geometry so he can't walk out or stand up
; (for example a corridor in Lighthouse). When he has been stuck for a quarter of a second, he is moved
; to the nearest spot where he fits (a unit or two, never through a wall). Walking into walls or
; corners never triggers it.
UnstickPlayer = 1
; Original level bug: in Lighthouse the mission script drops the lighthouse light 69 m in a tenth of a second
; to save rendering, and a guard walking next to it (the one on top of the lighthouse) gets flung out over
; the sea and walks about in mid-air there for the rest of the mission. Any character "falling" for 3 seconds
; without dropping is put back where he last stood, or where the map placed him (logged as [GUARD] ... put back).
RescueStuckNPCs = 1
; Original AI bug: when a guard's hand reaches a door that isn't fully closed (another guard just used it and
; it is still closing), his AI decides the door is open and walks on; the door shuts and he walks into it
; for good. 1 = when a guard has stood still for 1.5 s against a closed door his AI thinks is open, the door
; is opened for him the normal way (locked doors stay locked). Logged as [GUARD] ... opened ... for him.
FixStuckDoors = 1
; Wall bounce (wall jump) from Splinter Cell 1 and Pandora Tomorrow, removed in Chaos Theory: jump next to a
; wall (towards it, or running alongside it) and press jump again in the air to kick off it, higher. Use it to
; reach ledges you can't jump to.
WallBounce = 1
; Upward speed of the kick (Sam's normal jump is 520). Above ~850 Sam can hurt himself landing from a high
; kick (the game's fall damage starts at 1000). The kick goes straight up the wall unless you steer away from
; it or along it (WallBounceBoost below); then it leaves the wall at WallBounceOut / 2 or more.
WallBounceUp = 700
WallBounceOut = 150
; How far a wall may be from Sam's side, in any direction, for the second press to bounce off it (units).
; Walls, boxes, crates and other solid scenery count; characters don't.
WallBounceReach = 64
; Steering: hold a direction on the movement keys when you bounce (or up to WallBounceSteerTime seconds after)
; and Sam gets this much speed that way, e.g. run at a wall, jump, jump, hold back = a boost backwards.
; Keys pointing into the wall keep the normal push. 0 = off.
WallBounceBoost = 400
WallBounceSteerTime = 0.3
; Only moving jumps bounce: Sam must have left the ground at least this fast (units/s; walking is ~150-250,
; running ~400), so jumping up at something to climb it doesn't kick you off the wall.
WallBounceMinSpeed = 200
; 1 = standing jumps bounce too, straight up (WallBounceStandingUp; fall damage starts at a landing speed of
; 1000), with no push away from the wall.
WallBounceStanding = 0
WallBounceStandingUp = 850
; Kicks per jump: 1 = a single kick, 2 = double wall jumps (bounce off one wall, then off the opposite one).
WallBounceMax = 1
; 1 = keep holding jump after a wall bounce and Sam snaps into the split jump when he passes a split-jump spot
; (two close walls where he can split). A tap just bounces, so you can chain wall jumps.
WallBounceSplit = 1
; How long (seconds) jump has to be held for that. Only the press that made the bounce counts: a quick tap,
; or a new press for the next wall jump, never splits. Also applies to SplitFromFall.
WallBounceSplitHold = 0.2
; 1 = the same while falling with jump held, even without a bounce: catch yourself in a split-jump spot on the
; way down (split, drop, split...). The split you just dropped out of won't grab you again until you land.
SplitFromFall = 1
; Catching a long fall with a split still hurts: this fraction of the fall damage at the speed Sam was falling
; (0.5 = half; 0 = none). It never kills him: catching yourself always saves you, with at least 1 health left.
SplitCatchDamage = 0.5
; Animation the kicking leg takes its pose from (Chaos Theory has no wall-jump animation; this is the split
; pose) and how long the whole kick lasts, out and back.
WallBounceAnim = SpltStSpBg1
WallBounceAnimTime = 0.35
; How far the leg goes towards that pose: 1 = straight out to the side like the split, 0.5 = angled down,
; lower = closer to the falling pose.
WallBounceKickStrength = 0.5
; Wall in front of Sam: the leg takes the pose of the ledge hoist where he puts a foot up (knee up, foot
; forward) instead. Animation for each leg, which frame of it (0..1) and how far the leg goes towards it.
WallBounceFrontAnimRight = ledgcralftr
WallBounceFrontAnimLeft = ledgcralftl
WallBounceFrontFrame = 0.3
WallBounceFrontStrength = 1
; Which leg kicks: Auto = the leg on the wall's side (wall on your right, right leg), Swap = the other leg,
; Both = the whole body plays the animation (the dev.30 look).
WallBounceLeg = Auto
; 1 = the kick makes jump noise, so nearby guards can hear it.
WallBounceNoise = 1
; Landing from a fall: 1 = Sam only rolls when you pressed crouch (in the air or as he lands); the original
; also rolls on its own after a big drop when you're moving forward.
RollOnlyWhenCrouching = 1
; Hanging from a railing's top bar (a wall bounce often puts you there) or any ledge with a floor beyond it,
; the game won't let you climb up. 1 = hold forward or jump to climb over onto that floor.
ClimbOverRailings = 1
; Footstep noise comes from the walking animation's steps, so spamming crouch could skip steps and make Sam
; silent (an old Splinter Cell exploit). 1 = steps while crouch is being toggled count as standing steps, and a
; step that doesn't come while you toggle crouch is made anyway (logged as [CROUCH] ... made one).
CrouchNoiseFix = 1
; 1 = standing footsteps make the same noise for guards as crouched ones at the same speed (walking slowly
; upright is as quiet as walking slowly crouched; running is still louder than walking). 0 = original
; (standing is louder).
QuietStandingSteps = 1
; Original: pressing crouch again while Sam is still blending into the new stance waits until that blend is
; done (up to 0.3 s) or is skipped, so spamming crouch leaves his animation behind. 1 = the blend reverses at
; once from where it is.
CrouchInstantSwitch = 1
; Original bug: holding forward + a strafe key (W+A, W+D ...) makes Sam move faster, and therefore
; louder, than one key alone (the two inputs add up to 1.41x). 1 = diagonals move exactly as fast and as
; quietly as straight lines, at every mouse-wheel speed. Controller sticks are not affected.
EvenDiagonalSpeed = 1
; Number of walking-speed stages the mouse wheel steps through, from slowest to fastest.
; Original: 5. 9 = twice as fine (keeps the original 5 speeds and adds one between each pair).
; 2-41, or 0 = whatever SpeedInc your SplinterCell3User.ini binding uses.
SpeedStages = 9
; Guard personalities: every guard becomes faction-role-personality (e.g. guerilla-technician-paranoid),
; each with their own sight range, field of view, perception, search, aim and health. Good guards are rare
; on the lowest difficulty and common on Expert. Tables and numbers: SCCTRemaster_Guards.ini. 0 = off.
GuardPersonalities = 1
; Detection the same on every difficulty: the engine normally makes Sam x0.75 / x1 / x1.33 as visible and
; changes guards' awareness distances by difficulty. 1 / 2 / 3 = everyone uses the lowest / middle / Expert
; values (personalities then make individual guards better or worse). 0 = original behaviour.
DetectionBaseline = 2
; Original bug: when the network/co-op session is active (e.g. after visiting the co-op menus), its
; difficulty replaced the one you picked for a solo mission, so an Expert campaign could quietly run on an
; easier setting. 1 = solo missions always keep the difficulty you chose. (The log shows both values.)
FixSoloDifficulty = 1
; Bathhouse ending (Shetland's bombs in the furnace room): the elite guards are teleported in at the entrance
; the instant you defuse a bomb. This many seconds later instead (Shetland and the bombs keep their timing).
; 0 = original.
BathhouseEndingDelay = 15
; ...and a guard who is due waits while you're within this many metres of where he appears, so he never
; teleports in on top of you or right beside you. 0 = he comes in wherever you are.
BathhouseSpawnClearance = 6
; Hacking: the game gives each hack a few 'locks' for locking correct address fragments (0 on Expert's hardest
; hacks, after which fragment clicks silently do nothing), and every earlier hack of a device makes the next one
; harder. 1 = locks never run out and hacking a device again is no harder; failing or timing out still sounds the
; alarm. 0 = original.
FairHacking = 1
; CLUSTERFUCK: a fourth difficulty after EXPERT in the difficulty menu (Expert underneath). Elite guards with night
; vision, flashlights and endless ammo, all one party; base alert at the start of every mission with alarms; found
; bodies raise alarms; knocked-out guards wake up; endless searches; instant cameras; Sam has 50 HP, no medkits, half
; ammo, no pickups, no light/sound meters; every hack is the hardest (no locks); wall mines always go off when
; defused; Ironman (one save at the start of each mission); PERMADEATH: when Sam dies, that campaign's saves are
; deleted and a REST IN PEACE note is left in the save folder. Beat all 11 missions in one life and: YOU ACTUALLY
; DID IT! (a victory ceremony, a certificate in the save folder, a star in the menu). 0 = the menu entry is gone.
Clusterfuck = 1
; Beating CLUSTERFUCK also puts a copy of the victory certificate on your desktop. 0 = only in the save folder.
ClusterfuckCertificateOnDesktop = 1

[Mods]
; Load mods from the Mods folder next to System and Data (Mods\<name>\, see Mods\README.txt). Files in a mod's
; System\ and Data\ folders replace the game's files with the same path or add new ones. 0 = ignore the folder.
Mods = 1
; Log each game file a mod provides, the first time the game opens it ([MODS] lines).
LogModFiles = 1
; Run the mods' Lua scripts (Mods\<name>\Scripts\*.lua, see Mods\SCRIPTING.txt). 0 = off.
Scripts = 1
; Held with Ctrl, reloads every mod's scripts while playing (virtual key code, 0 = no key; the level editor's Tools tab has it).
ReloadScriptsKey = 0
; Texture packs: replace textures with the images in the mods' Textures folders (see Mods\TEXTURES.txt).
TexturePacks = 1
; Save every texture the game loads to Mods\_TextureDump (to make texture packs). The level editor's Tools tab
; switches it on and off, and so does Ctrl+DumpTexturesKey (virtual key code, 0 = no key).
DumpTextures = 0
DumpTexturesKey = 0
; png (easy to edit) or dds (the texture in its own format, DXT included).
DumpFormat = png
; Level changes: apply the mods' Levels\<map>.txt when a mission starts (see Mods\LEVELS.txt).
LevelChanges = 1
; Held with Ctrl, lists every actor of the current level in Mods\_LevelDump (virtual key code, 0 = no key; the level
; editor's Tools tab has it).
LevelDumpKey = 0

[Editor]
; In-game level editor: this key opens and closes it (virtual key code; 0xC0 = the ~ key, which the game doesn't use;
; 0 = off). While it's open the mouse and keyboard belong to the editor.
EditorKey = 0xC0
; Freeze the world while the editor is open (its Tools tab switches it too).
EditorPause = 1
; The mod folder the editor's Save writes level files to (Mods\<folder>\Levels\<map>.txt).
SaveFolder = MyLevel

[Debug]
; 1 = normal log, 2 = verbose (every patch address).
LogLevel = 1
; Log the classification of every actor class (logic rate system).
LogActorClasses = 0
; Key that captures two frames of rendering to SCCTRemaster_capture_N.txt (virtual key code,
; 0x79 = F10, 0 = disabled). Used to diagnose rendering bugs such as AMD thermal vision.
CaptureKey = 0x79
; Capture one frame by itself this many seconds after the game starts (0 = off).
AutoCaptureAt = 0
; Log, once per shader combination, what each Shader Model 1.1 shader is given ([SHADER] lines; for the
; shader pack work). Only does anything with ShaderModel = 1.
LogShaderInputs = 0
; Log a breakdown of where the time went for every second with frame drops.
PerfLog = 1
; Log when Sam is trying to move but stays in place, with the collision the engine reports.
StuckDiagnostics = 0
; Press F9 to log every HUD/menu image and draw call in the next 80 ms (position, colour, calling code).
LogHudImages = 0
; Log every instruction that reads GameInfo.VisCrouchMul (hardware watchpoint; investigation tool).
WatchVisCrouchMul = 0
; Log Sam's health, inventory, ammo and the alarm count when saving and after loading ([SAM] lines).
SaveAudit = 0
; Log Sam's animation channels for 2 s after each crouch toggle ([CROUCH] lines), to work on crouch transitions.
LogCrouch = 0
; Log when an on-screen cursor (menus, hacking, keypads) jumps by more than the mouse moved it ([CURSOR] lines).
LogCursor = 1
; Hold this key to run the game at 30 FPS (virtual key code, e.g. 0x7A = F11, 0 = disabled).
; For comparing behaviour at low and high frame rates.
SlowKey = 0

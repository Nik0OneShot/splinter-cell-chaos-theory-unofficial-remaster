; Guard personalities - Splinter Cell Chaos Theory Unofficial Remaster
;
; Every guard becomes  faction-role-personality,  e.g. "guerilla-technician-paranoid":
;   faction      from the start of the guard's class name  (EPeoplesVoiceSoldier -> guerilla)
;   role         from the rest of the class name           (EPeoplesVoiceSoldier -> soldier)
;   personality  rolled per guard from the [Personality.*] sections, weighted by difficulty
; Because it goes by class, a People's Voice soldier placed in any map (custom levels too) is still a
; guerilla. The roll is seeded from the guard's name, so a guard is the same person every time you load.
;
; Each layer multiplies the guard's own values (1.0 = unchanged):
;   Sight       how far he can see
;   Cone        how wide his field of view is (horizontal and vertical)
;   Perception  how bright Sam looks to him (higher = spots you in less light)
;   Search      how thoroughly he searches
;   Aim         gun accuracy (capped at perfect)
;   Health      health
;   Shadow      how often he checks for Sam's shadow (0 = never notices shadows, 2 = twice as often)
;   Hearing     how far away he hears noises: footsteps, doors, objects... (walls still muffle them)
; and can grant:
;   Thermal     chance (0-1) of thermal vision: darkness doesn't hide you from him at all
;   Deaf        chance (0-1) of hearing nothing
; The three layers multiply together, e.g. guerilla 0.9 x technician 0.9 x noob 0.75 sight.
; One trait adds up instead:
;   Reaction    seconds he needs on top of [Perception] ReactionMin before he reacts to seeing you: one value,
;               or a range (e.g. 0.2, 0.3) rolled per guard. Faction, role and personality values are added.
;
; Turn the whole system off with [Gameplay] GuardPersonalities = 0 in SCCTRemaster.ini.
; [Gameplay] DetectionBaseline there makes the engine's own detection the same on every difficulty.

[General]
; Write each guard's result to SCCTRemaster.log ([GUARD] lines).
LogGuards = 1

[Perception]
; How guards see you. The game's sight check already makes you more visible when you move (up to x2 at a
; run), nearer (up to x2 very close) and taller (standing is easier to spot at a distance), and less
; visible in the dark. These options change the rest:
;
; Guards notice Sam's shadow cast by lights. Originally only a few lights in 9 maps were set up for it.
; 1 = every shadow-casting light (MGS2 style), 0 = original. How quickly each guard notices it is his Shadow
; trait (below).
ShadowDetection = 1
; Limits for the extra lights' shadows (the designers' own shadow lights are unchanged): a guard only notices
; one within ShadowSightRange of him (metres, 0 = no limit), and only where the light lights the spot it falls
; on at least ShadowMinLight (the light meter's scale, see SkyBrightness; 0 = no minimum). A faint lamp, or a
; shadow far down an alley, goes unnoticed.
ShadowSightRange = 10
ShadowMinLight = 40
; Peripheral vision. The original computed how far off-centre you are and then ignored it, so a guard saw
; you as well at the edge of his view as dead ahead. 1 = full sight in the middle of his view, fading
; towards the edge. Movement still counts double, so running past his side is still noticed.
PeripheralVision = 1
; How visible you are at the very edge of his field of view (1.0 = no peripheral effect).
PeripheralEdge = 0.4
; Fraction of his half field of view that has full sight before it starts fading.
PeripheralStart = 0.35
; 1 = a standing Sam is judged by his crouched silhouette, so standing is no easier to spot at a distance
; than crouching (light on you, movement and everything else still count). 0 = original.
CrouchSilhouette = 1
; Directional lighting: each guard sees the side of Sam facing him. A lamp lights the side of Sam towards it:
; it counts fully for a guard on the lamp's side, about half from the side, and only DarkSide when it is
; behind Sam from the guard's view (the ambient light always counts). A guard on the lit side sees the
; original light level. The HUD light meter still shows all sides. 0 = original.
DirectionalLighting = 1
; How much of a lamp still counts on Sam's far side (bounce light). 0 = none, 1 = no directional effect.
DarkSide = 0.25
; Partial cover: the game judges how lit Sam is from a few bones on him (head, body, feet) and a guard who can
; see any of him gets the whole value, so one foot sticking into a lamp's light behind the trash bags lit him up
; for a guard who could only see his dark head. 1 = each guard only counts the bones he can actually see (the
; guards' own sight line check). 0 = original.
PartialCover = 1
; Spotlight beams: the guards' light maths lit a spotlight's (work lamp's) whole frame right up to its edges at
; full strength, while on screen the beam is round and fades out well before that, so a spot that looked dark
; could count as brightly lit. 1 = a spotlight's light on Sam fades like the beam you see: full in the middle
; BeamCore of its frame, nothing at the edge. 0 = original.
SpotlightBeam = 1
BeamCore = 0.4
; Backlighting: a guard looks past Sam at what's behind him (five lines through his head, middle, legs and
; sides). If the background is brighter than Sam (a lit wall, a window, a fire, the sky), his dark silhouette
; stands out: his light level rises by BacklightStrength x the difference, even in total darkness. The
; background is the average of the five lines, so one lit patch beside him counts for a fifth; a part of Sam
; the guard can't see (behind cover, like the trash bags you crouch behind) counts as no outline. 0 = original.
Backlighting = 1
BacklightStrength = 0.6
; Light level of open sky behind Sam (the light meter's scale: 10 barely, 45 partially, 80 mostly,
; 120 fully visible).
SkyBrightness = 40
; Background further away than this (units, 100 = 1 m) also counts as sky.
SkyDistance = 3000
; Reaction times. Originally a guard who saw you clearly attacked in the same instant (shout, cover or open
; fire), and in a fight he shot the moment you peeked out. Now every guard needs ReactionMin seconds (the average
; human reaction time: nobody reacts faster) plus his Reaction trait (personality, role) of seeing you before he
; reacts, longer the harder you are to make out (x1.25 mostly visible, x1.6 partly, x2.2 barely).
; Out of view before that and he never saw you; if he was at least half way there, he goes to check the spot
; where he saw you (Glimpse = 1). Once he knows you're there (fighting you, or he saw or heard you in the last
; PeekMemory seconds), coming back into view after ReactionForget seconds out of it needs PeekReactionFactor x
; his time, at least PeekReactionMin (0.15 s: he's already looking at the spot): peeking out gets you seen
; faster, but not instantly. 0 = original.
Reaction = 1
ReactionMin = 0.25
PeekReactionFactor = 0.6
PeekReactionMin = 0.15
ReactionForget = 0.5
PeekMemory = 10
Glimpse = 1
; Focus: a guard in a fight with another NPC (factions fighting each other: the Bathhouse private baths fight,
; or any map or mod) puts that fight first. While an NPC enemy he's fighting was in his sights or hurt him in
; the last FocusMemory seconds (and you aren't his current enemy), he doesn't notice you and ignores every noise
; you make, unless you're within FocusRange metres and FocusCone degrees of where he's facing, or for FocusBreak
; seconds after you shoot at him or hurt him. 0 = original.
Focus = 1
FocusMemory = 3
FocusRange = 4
FocusCone = 30
FocusBreak = 5
; Noise pollution: what guards themselves do drowns out your noises, as machinery and thunder already do. Their
; gunfire and other loud noises (explosions, grenades, shattering, alarms; fading over GunfireFade seconds) and their
; footsteps (GuardWalkNoise / GuardRunNoise dB at 1 m, out to FootstepMaskRange metres) mask your footsteps, landings,
; whistling, voice and gunshots, 6 dB less per doubling of distance. A guard who is shooting or walking hears less
; himself, and guard noise around you raises the ambient level on the HUD sound meter: while it's above your noise,
; nobody hears you. Levels are in dB like the meter (0-120; your footsteps are about 5-40). 0 = original.
NoisePollution = 1
GuardWalkNoise = 20
GuardRunNoise = 35
FootstepMaskRange = 8
GunfireFade = 1
; Your noise level (the sound meter's own bar, and what guards' hearing compares against) fades a step every frame,
; tuned for 30 fps: at high frame rates your noises died away several times too fast. NoiseDecayRate is how many of
; those steps a second it takes whatever the frame rate (30: halves every 0.22 s). 0 = original (frame rate dependent).
NoiseDecayRate = 30
; Footstep sync: walk at a guard's pace, matching his speed within SyncSpeed percent and his heading within SyncAngle
; degrees, within SyncRange metres of him, and after SyncTime seconds your footsteps are lost in his: no one hears
; them, and the sound meter's ambient level sits just above them. It holds for half a second if you fall out of step
; (corners, a pause). 0 = off.
FootstepSync = 1
SyncRange = 6
SyncSpeed = 20
SyncAngle = 25
SyncTime = 0.75
; Draw time: a guard who spots you raises his gun before he shoots. His first shot comes DrawTime seconds after he
; spotted you (quicker guards sooner: x0.6-1.6 by personality), with his gun on you for at least DrawAimTime
; seconds. After DrawReady seconds without shooting at you, he has to draw again. 0 = original (instant fire).
DrawTime = 1
DrawAimTime = 0.35
DrawReady = 5
; Guard turning: guards turn to face what they look or aim at a step every AI tick, tuned for 30 fps, so at high
; frame rates they snapped round several times faster (0.05 s at 160 fps). TurnRate is how many of those steps a
; second they take whatever the frame rate (30: 90% of a turn in 0.27 s; a shooting guard takes two steps a tick,
; 0.13 s). While a guard is drawing on you he turns at DrawTurnSpeed times that. TurnRate = 0 = original (frame
; rate dependent).
TurnRate = 30
DrawTurnSpeed = 0.6
; UAV camera heads swung onto their target a fixed step every frame (90 degrees in 0.025 s at 160 fps; 0.11 s at
; the original 30 fps). Now they turn by time at UAVTurnSpeed times the original 30 fps speed (0.6: 90 degrees in
; 0.18 s when attacking, slower while drawing on you). 0 = original (frame rate dependent).
UAVTurnSpeed = 0.6
; Combat reaction: a guard who gets you back in his sights after ReacquireAfter seconds out of them (you peek,
; come round a corner, step out of cover) needs his reaction time (CombatReaction x his personality's, about
; 0.3-0.6 s) before he can fire again. 0 = original (fires the instant you show).
CombatReaction = 1
ReacquireAfter = 0.3
; Guard aim: the original doesn't aim at all: a guard's shot hits or misses by a quota (his accuracy x2.5 within
; 1 m) that makes a guard who hasn't hit you lately sure to hit, and his first shot always hits. Now his hit chance
; starts at 0.2x when he gets you in his sights (or his gun comes up) and rises to normal over AimSettleTime seconds
; (x his personality), drops when you move across his view (halved at AimTrackSpeed radians a second: running
; sideways 3 m away) and is x AimWhileMoving while he moves himself. FairHitRoll = 1: a shot hits with exactly that
; chance (0 = the original quota). FirstShotHit = 1 brings back the guaranteed first hit. 0 = off for each.
AimSettleTime = 1.2
AimTrackSpeed = 0.8
AimWhileMoving = 0.6
FirstShotHit = 0
FairHitRoll = 1
; Fire rate: a guard firing at a spot he can't see into (you behind a closed door) re-started his burst every
; frame and fired each time: ~150 shots a second at high frame rates. His shots are now at least this many
; seconds apart (normal automatic fire is ~0.07 s). 0 = original.
NPCShotInterval = 0.066
; Sprint windup: a guard breaking into a run reached full speed in about a quarter of a second. Above patrol pace
; (180 units/s) his speed now rises at most NPCRunAccel units/s per second (450: walk to full run in about 0.6 s).
; 0 = original.
NPCRunAccel = 450
; Stance blend: guards crouching or standing up while standing still snapped into the other pose in one frame.
; Now they blend out of the old pose over StanceBlendTime seconds. 0 = original.
StanceBlendTime = 0.35
; Flinch: a guard you hit can't fire back for FlinchTime seconds (x0.8-1.2), and his aim has to settle again.
FlinchTime = 0.6
; Suppression: your shots landing around a guard (near misses, ricochets) throw his aim off (hit chance x(1 -
; SuppressionAim x level); each near miss adds 0.35, a hit 0.5, the level halving every SuppressionDecay seconds)
; and pin him: no firing for SuppressionPin seconds after each one.
SuppressionAim = 0.6
SuppressionDecay = 1.2
SuppressionPin = 0.3
; Ducking: a guard under heavy fire (suppression at SuppressionDuckLevel or more: about two near misses close
; together) keeps firing from a crouch for SuppressionDuck seconds (x0.8-1.2), extended while the fire keeps
; coming. 0 = he stays standing.
SuppressionDuck = 1.2
SuppressionDuckLevel = 0.6
; Warning shots: a guard who spots you at least WarningShotRange metres away, while you haven't fired on anyone
; in the last 10 s, fires a deliberate miss first WarningShotChance of the time, then waits WarningShotPause s.
WarningShotChance = 0.5
WarningShotRange = 8
WarningShotPause = 0.8
; Darkness and goggles: the darker you are (your light level from 30 down to 5) the more a guard misses, counting
; from 3 m and fully at 10 m: hit chance x(1 - DarknessAim) at most. Guards with night vision or thermal goggles
; ignore it.
DarknessAim = 0.7
; Wounds: a hurt guard aims worse: hit chance x(1 - WoundedAim x the health he has lost).
WoundedAim = 0.5
; Gun raise: the game has no draw animation (a guard's pose snaps from gun-down to gun-up in under 0.2 s, and a
; gun he had put away just appears in his hands). Now a guard whose gun was put away draws it over GunDrawTime
; seconds (his holster animation backwards), and one whose gun was down keeps it down for GunRaiseDelay seconds;
; then he brings it up over GunRaiseTime seconds (all x0.8-1.4 by personality), and doesn't shoot before it's up.
; GunRaiseTime = 0 = original.
GunRaiseTime = 0.7
GunRaiseDelay = 0.1
GunDrawTime = 0.6
; Call-out: a guard who spots you keeps it to himself for CallOutTime seconds (x0.6-1.6 by personality) before the
; guards around him hear about it. Knock him out, kill or grab him before then and nobody hears it from him (his
; gunfire is still heard); hitting him holds it back until he recovers from the flinch. While he keeps you in sight
; his updates go out at once; once he hasn't had you for CallOutAgain seconds, finding you again has to be called in
; again, even mid-fight. 0 = original (the whole area knows the moment he sees you).
CallOutTime = 2.5
CallOutAgain = 3
; Write a sample of the peripheral/silhouette/lighting factors to the log every 2 s, every shadow sighting and
; every AI event a guard near Sam receives ("[EVENT] ... got AI_SEE_ENEMY_BARELY about Sam": what made him react), and
; each reaction ("[REACT] ... reacted after 0.42 s"), focus ("[FOCUS] ... ignored ... about Sam") and every fast turn
; ("[TURN] ... turned 150 deg in 0.02 s": what swung him round), and what guard noise drowned out ("[NOISE] ...
; didn't hear Sam's footstep", "Sam fell into step with a guard"), each draw ("[DRAW] ... first shot in
; 0.95 s"), call-out ("[ALERT] ... calls it in after 2.10 s"), combat ("[COMBAT] ... hit chance 0.90 -> 0.35")
; and stance blends ("[STANCE]"). Also enables F8: log the lighting check as a guard
; standing at your camera would see it.
LogPerception = 0

